services:
  app:
    environment:
      MAILER_DSN: smtp://mailer:1025

  mailer:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_HTTP_PORT:-8026}:8025"
    networks:
      - app

  database:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
